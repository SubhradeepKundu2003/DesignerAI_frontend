<div class="toolbar">
  <div class="toolbar__brand">
    <span class="toolbar__mark">D</span>
    <span class="toolbar__title">Untitled newsletter</span>
    @if (justSaved()) {
      <span class="toolbar__saved">Saved</span>
    }
  </div>

  <div class="toolbar__group" role="group" aria-label="Persistence">
    <app-icon-button icon="save" label="Save" (activated)="save()" />
    <app-icon-button icon="open" label="Load" [disabled]="!canLoad()" (activated)="load()" />
  </div>

  <span class="toolbar__divider" role="separator"></span>

  <div class="toolbar__group" role="group" aria-label="Project file">
    <app-icon-button icon="download" label="Export project (.dzn)" (activated)="exportProject()" />
    <app-icon-button icon="upload" label="Import project (.dzn)" (activated)="pickProjectFile()" />
    <input
      #importInput
      type="file"
      accept=".dzn"
      hidden
      (change)="onProjectFileSelected($event)"
    />
    @if (importError(); as message) {
      <span class="toolbar__error" role="alert">{{ message }}</span>
    }
  </div>

  <span class="toolbar__divider" role="separator"></span>

  <div class="toolbar__group" role="group" aria-label="History">
    <app-icon-button
      icon="undo"
      [label]="undoLabel()"
      [disabled]="!canUndo()"
      (activated)="undo()"
    />
    <app-icon-button
      icon="redo"
      [label]="redoLabel()"
      [disabled]="!canRedo()"
      (activated)="redo()"
    />
  </div>

  <span class="toolbar__divider" role="separator"></span>

  <div class="toolbar__group" role="group" aria-label="Object">
    <app-icon-button
      icon="duplicate"
      label="Duplicate"
      [disabled]="!canDuplicate()"
      (activated)="duplicate()"
    />
    <app-icon-button icon="trash" label="Delete" [disabled]="!canDelete()" (activated)="delete()" />
  </div>

  <span class="toolbar__divider" role="separator"></span>

  <div class="toolbar__group" role="group" aria-label="Grouping">
    <app-icon-button icon="group" label="Group" [disabled]="!canGroup()" (activated)="group()" />
    <app-icon-button
      icon="ungroup"
      label="Ungroup"
      [disabled]="!canUngroup()"
      (activated)="ungroup()"
    />
    <app-icon-button icon="frame" label="Frame" [disabled]="!canFrame()" (activated)="frame()" />
    <app-icon-button
      icon="ungroupFrame"
      label="Dissolve frame"
      [disabled]="!canDissolveFrame()"
      (activated)="dissolveFrame()"
    />
  </div>

  <span class="toolbar__divider" role="separator"></span>

  <div class="toolbar__group" role="group" aria-label="Arrange">
    <app-icon-button
      icon="bringForward"
      label="Bring forward"
      [disabled]="!canBringForward()"
      (activated)="bringForward()"
    />
    <app-icon-button
      icon="sendBackward"
      label="Send backward"
      [disabled]="!canSendBackward()"
      (activated)="sendBackward()"
    />
  </div>

  <label class="toolbar__theme">
    <span class="toolbar__theme-label">Theme</span>
    <select
      class="toolbar__theme-select"
      aria-label="Theme"
      [value]="activeThemeId()"
      (change)="setTheme($any($event.target).value)"
    >
      @for (preset of themePresets; track preset.id) {
        <option [value]="preset.id">{{ preset.name }}</option>
      }
    </select>
  </label>

  <span class="toolbar__spacer"></span>

  <div class="toolbar__group" role="group" aria-label="Canvas aids">
    <app-icon-button
      icon="grid"
      label="Toggle grid"
      variant="toggle"
      [active]="gridVisible()"
      (activated)="toggleGrid()"
    />
    <app-icon-button
      icon="magnet"
      label="Toggle snapping"
      variant="toggle"
      [active]="snapEnabled()"
      (activated)="toggleSnap()"
    />
  </div>

  <span class="toolbar__divider" role="separator"></span>

  <output class="toolbar__zoom" aria-label="Current zoom">{{ zoomPercent() }}%</output>
</div>
