<label class="select-input">
  <span class="select-input__label">{{ label() }}</span>
  <select [disabled]="disabled()" (change)="onChange($any($event.target).value)">
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
</label>
